<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Group
    </title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<body>

    <!-- GRID BACKGROUND -->
    <div class="bg-grid"></div>


    <!-- FADED BACKGROUND TEXT -->
    <div class="bg-text">
        ExpenseIQ
    </div>


    <!-- LOGOUT -->
    <button
        class="logout-btn"
        onclick="logout()"
    >
        Logout
    </button>


    <!-- MAIN CONTAINER -->
    <div class="app-container">


        <!-- LEFT PANEL -->
        <div class="summary-panel">


           
<!-- GROUP HEADER -->
<div class="group-header-top">

    <div class="group-badge">
        Active Group
    </div>

    <button
        type="button"
        id="openInviteModal"
        class="invite-member-btn"
    >
        <span class="invite-icon" aria-hidden="true">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="10" cy="7" r="4"/>
                <line x1="19" y1="8" x2="19" y2="14"/>
                <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
        </span>
        Invite Member
    </button>

</div>

<!-- GROUP TITLE -->
<h2 class="group-title" id="groupTitle">
    Group ✈️
</h2>



            <!-- RECENT ACTIVITY -->
            <div class="recent-activity">
                <div class="total-spend-badge" style="
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(6, 182, 212, 0.05));
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
    text-align: left;
">
    <p style="margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; font-weight: 600;">
        Total Group Spend
    </p>
    <h2 id="totalGroupSpend" style="margin: 4px 0 0 0; font-size: 2.2rem; font-weight: 800; color: #38bdf8;">
        ₹0
    </h2>
</div>

<h2>Recent Split Log</h2>



                <!-- EXPENSES WILL LOAD HERE -->
                <div id="expensesContainer">

                </div>

            </div>

        </div>


        <!-- RIGHT PANEL -->
        <div class="form-panel">


            <div class="expense-card">


                <h2>

                    Add Expense

                </h2>


                <!-- FORM -->
                <form id="expenseForm">


                    <!-- EXPENSE TITLE -->
                    <div class="input-wrapper">

                        <label>

                            What did you pay for?

                        </label>

                        <input
                            type="text"
                            id="expenseTitle"
                            placeholder="e.g. Dinner, Fuel, Hotel"
                            class="form-input"
                            required
                        >

                    </div>


                    <!-- EXPENSE AMOUNT -->
                    <div class="input-wrapper">

                        <label>

                            Amount

                        </label>


                        <div class="currency-input">

                            <span class="currency-symbol">

                                ₹

                            </span>

                            <input
                                type="number"
                                id="expenseAmount"
                                placeholder="0.00"
                                class="form-input price-field"
                                required
                            >

                        </div>

                    </div>


                    <!-- SUBMIT -->
                    <button
                        type="submit"
                        class="add-expense-btn"
                    >

                        Add Expense

                    </button>

                </form>

            </div>

        </div>

    </div>

    
<!-- INVITE MEMBER MODAL -->
<div class="invite-modal-overlay" id="inviteModalOverlay">

    <div class="invite-modal" role="dialog" aria-modal="true" aria-labelledby="inviteModalTitle">

        <button
            type="button"
            class="invite-modal-close"
            id="closeInviteModal"
            aria-label="Close invite dialog"
        >
            &times;
        </button>

        <div class="invite-modal-header">
            
<div class="invite-modal-icon" aria-hidden="true">
    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="34"
        height="34"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="10" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
    </svg>
</div>


            <div>
                <h2 id="inviteModalTitle">Invite Member</h2>
                <p>Add someone to your group</p>
            </div>
        </div>

        <form id="inviteMemberForm">

            <label for="inviteUserInput">Username or Email</label>

            <input
                type="text"
                id="inviteUserInput"
                class="form-input invite-user-input"
                placeholder="Enter username or email"
                autocomplete="off"
                required
            >

            <p class="invite-helper">
                ⓘ You can enter either a username or an email address.
            </p>

            <div
                id="inviteFeedback"
                class="invite-feedback"
                role="status"
                aria-live="polite"
            ></div>

            <div class="invite-modal-actions">
                <button
                    type="button"
                    id="cancelInviteModal"
                    class="invite-cancel-btn"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    id="sendInvitationBtn"
                    class="invite-submit-btn"
                >
                    Send Invitation
                </button>
            </div>

        </form>

    </div>

</div>


    <!-- JS -->
    <script src="./js/group.js"></script>

</body>

</html>
