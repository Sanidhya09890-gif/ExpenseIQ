<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ExpenseIQ Dashboard</title>

    <link rel="stylesheet" href="./css/style.css">

</head>

<body class="dashboard-page">

    <!-- GRID BACKGROUND -->
    <div class="bg-grid"></div>

    <!-- BIG BACKGROUND TEXT -->
    <div class="bg-text">
        ExpenseIQ
    </div>

 <!-- TOP ACTIONS -->
<div class="top-actions">

    <!-- NOTIFICATION BUTTON -->
<button
    class="notification-btn"
    id="notificationBtn"
    aria-label="Notifications"
    aria-controls="notificationPanel"
    aria-expanded="false"
    type="button"
>

    <span class="bell-icon">

       <svg
    class="generated-bell"
    viewBox="0 0 48 48"
    width="34"
    height="34"
    xmlns="http://www.w3.org/2000/svg"
>
    <!-- top knob -->
    <circle
        cx="24"
        cy="7"
        r="2.5"
        fill="currentColor"
    />

    <!-- bell body -->
    <path
        d="M12 28
           C12 25 15 23 15 17
           C15 11.5 18.5 8 24 8
           C29.5 8 33 11.5 33 17
           C33 23 36 25 36 28
           Z"
        fill="currentColor"
    />

    <!-- bottom rim -->
    <path
        d="M10 29
           C10 27.8 11 27 12.2 27
           H35.8
           C37 27 38 27.8 38 29
           C38 30.2 37 31 35.8 31
           H12.2
           C11 31 10 30.2 10 29
           Z"
        fill="currentColor"
    />

    <!-- clapper -->
    <circle
        cx="24"
        cy="34"
        r="3"
        fill="currentColor"
    />

</svg>

    </span>

    <span
        class="notification-badge"
        id="notificationBadge"
    ></span>

    <span class="notification-tooltip">
        Notifications
    </span>

</button>


    <!-- NOTIFICATION PANEL -->
    <div
        class="notification-panel"
        id="notificationPanel"
    >

        <!-- PANEL HEADER -->
        <div class="notification-panel-header">

            <div>

                <h3>
    <span class="panel-bell">
         <span class="panel-bell-inner">
        <svg
    viewBox="0 0 48 48"
    xmlns="http://www.w3.org/2000/svg"
>
      <g>
    <!-- top knob -->
    <circle
        cx="24"
        cy="9"
        r="2"
        fill="currentColor"
    />

    <!-- bell body -->
    <path
        d="M12 29
           C12 26 15 24 15 18
           C15 12 18.5 9 24 9
           C29.5 9 33 12 33 18
           C33 24 36 26 36 29
           Z"
        fill="currentColor"
    />

    <!-- bottom rim -->
    <path
        d="M10 30
           C10 28.8 11 28 12.2 28
           H35.8
           C37 28 38 28.8 38 30
           C38 31.2 37 32 35.8 32
           H12.2
           C11 32 10 31.2 10 30
           Z"
        fill="currentColor"
    />

    <!-- clapper -->
    <circle
        cx="24"
        cy="35"
        r="3"
        fill="currentColor"
    />

    <!-- ringing rays -->
    <path
        d="M8 17L5 14"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"
    />

    <path
        d="M40 17L43 14"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"
    />

    <path
        d="M7 23H3"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"
    />

    <path
        d="M41 23H45"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.8"
    />
    </g>
    </svg>
    </span>
    </span>

    Notifications
</h3>

                <span>
                    Stay updated with your activity
                </span>

            </div>


            <button
                class="notification-close"
                id="notificationClose"
                aria-label="Close notifications"
                type="button"
            >
                ×
            </button>

        </div>


        <!-- NOTIFICATIONS LIST -->
        <div
            class="notification-list"
            id="notificationList"
        >

            <!-- Notifications will appear here -->

        </div>

    </div>


    <!-- LOGOUT BUTTON -->
    <button
        class="logout-btn"
        onclick="logout()"
    >
        Logout
    </button>

</div>


    <main class="dashboard-layout">


        <!-- LEFT SIDE -->
        <div class="hero-side">

            <h1 class="main-slogan">

                Every Expense.
                <br>

                <span>
                    Perfectly Clear.
                </span>

            </h1>

            <p class="sub-slogan">

                Track shared expenses, split costs fairly, and keep every group balance organized — all in one place.

            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="card-side">

            <div class="dashboard-card">


                <!-- WELCOME -->
             <div class="welcome-box" id="welcomeText">
    <span class="welcome-label">Welcome!!</span>
    <br>
    Guest 👋
    </div>

                <!-- GROUP FORM -->
                <form
                    id="groupForm"
                    class="group-form"
                >

                    <h2 class="dashboard-section-title">Create a group</h2>
                    <label for="groupName" class="group-name-label">Group name</label>
                    <input
                        type="text"
                        id="groupName"
                        name="groupName"
                        placeholder="Enter Group Name"
                        class="group-input"
                        required
                    >




                    <button type="submit">
                        Create Group
                    </button>

                </form>


                <!-- GROUPS -->
                <h2 class="dashboard-section-title groups-heading">Your Groups <span class="group-count" id="groupCount" aria-label="Group count" aria-live="polite">—</span></h2>
                <p class="groups-description">Manage your shared expenses</p>
                <div id="groupsContainer">
                    
                </div>

            </div>

        </div>

    </main>

    <script src="./js/feedback.js"></script>
    <script src="./js/dashboard.js"></script>

</body>

</html>
